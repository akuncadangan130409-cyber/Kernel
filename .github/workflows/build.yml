name: Build KernelSU for Munch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio flex git \
            libelf-dev libncurses5 libncurses-dev libssl-dev libtinfo5 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 unzip zip

      - name: Fetch pinned kernel sources and toolchains
        env:
          KERNEL_COMMIT: 9aba441cf6cd86f1e81ee6a2608e9102b05c52a7
          DISPLAY_COMMIT: 2fdca387269615872d4ff798e8da7d33345c1338
          GCC_COMMIT: 961622e926a1b21382dba4dd9fe0e5fb3ee5ab7c
          CLANG_COMMIT: 252aba16f513a857bc923172f67b0e55e23de35f
        run: |
          set -euo pipefail
          KERNEL_SRC="$RUNNER_TEMP/munch-kernel"
          DISPLAY_SRC="$RUNNER_TEMP/alioth-display"
          GCC_SRC="$RUNNER_TEMP/aarch64-gcc49"
          CLANG_SRC="$RUNNER_TEMP/aosp-clang"

          git clone --depth=1 --single-branch --branch munch-s-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git "$KERNEL_SRC"
          test "$(git -C "$KERNEL_SRC" rev-parse HEAD)" = "$KERNEL_COMMIT"

          git clone --depth=1 --filter=blob:none --sparse --single-branch --branch alioth-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git "$DISPLAY_SRC"
          test "$(git -C "$DISPLAY_SRC" rev-parse HEAD)" = "$DISPLAY_COMMIT"
          git -C "$DISPLAY_SRC" sparse-checkout set techpack/display
          cp -a "$DISPLAY_SRC/techpack/display" "$KERNEL_SRC/techpack/display"
          test -s "$KERNEL_SRC/techpack/display/msm/dsi/dsi_display_mi.c"
          test -s "$KERNEL_SRC/techpack/display/msm/xiaomi_frame_stat.c"

          git clone --depth=1 --filter=blob:none --sparse --single-branch \
            --branch android-msm-barbet-4.19-android12-qpr1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 "$GCC_SRC"
          test "$(git -C "$GCC_SRC" rev-parse HEAD)" = "$GCC_COMMIT"
          git -C "$GCC_SRC" sparse-checkout set bin lib libexec aarch64-linux-android
          test -x "$GCC_SRC/bin/aarch64-linux-android-gcc"
          "$GCC_SRC/bin/aarch64-linux-android-gcc" --version | head -n 1

          git init "$CLANG_SRC"
          git -C "$CLANG_SRC" remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git -C "$CLANG_SRC" sparse-checkout init --cone
          git -C "$CLANG_SRC" sparse-checkout set clang-r383902
          git -C "$CLANG_SRC" fetch --depth=1 --filter=blob:none origin refs/heads/android11-release
          git -C "$CLANG_SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$CLANG_SRC" rev-parse HEAD)" = "$CLANG_COMMIT"
          test -x "$CLANG_SRC/clang-r383902/bin/clang"

          echo "KERNEL_SRC=$KERNEL_SRC" >> "$GITHUB_ENV"
          echo "DISPLAY_COMMIT=$DISPLAY_COMMIT" >> "$GITHUB_ENV"
          echo "GCC_BIN=$GCC_SRC/bin" >> "$GITHUB_ENV"
          echo "CLANG_BIN=$CLANG_SRC/clang-r383902/bin" >> "$GITHUB_ENV"

      - name: Integrate legacy KernelSU and build
        env:
          KSU_TAG: v0.9.5
          STOCK_KERNEL_RELEASE: 4.19.157-perf-g045c5942d886
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "::error::Failed at line %s: %s (exit %s)\n" "$LINENO" "$BASH_COMMAND" "$rc"; exit "$rc"' ERR
          cd "$KERNEL_SRC"
          curl -fsSL "https://raw.githubusercontent.com/tiann/KernelSU/$KSU_TAG/kernel/setup.sh" -o "$RUNNER_TEMP/ksu-setup.sh"
          bash "$RUNNER_TEMP/ksu-setup.sh" "$KSU_TAG"
          test "$(git -C KernelSU rev-parse HEAD)" = b766b98513b5a7eb33bc1c4a76b5702bf1288f07

          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("scripts/gcc-wrapper.py")
          s = p.read_text()
          nl = chr(92) + "n"
          replacements = [
              ("    line = line.rstrip('" + nl + "')",
               "    if isinstance(line, bytes):\n        line = line.decode('utf-8', errors='replace')\n    line = line.rstrip('" + nl + "')"),
              ("    args = sys.argv[1:]",
               "    args = sys.argv[1:]\n    if '-D__GENKSYMS__' in args:\n        args[0] = os.environ.get('GENKSYMS_CC', args[0])\n        clang_flags = os.environ.get('CLANG_FLAGS', '').split()\n        args = [arg for arg in args if arg not in clang_flags and not arg.startswith('-W') and not arg.startswith(('--target=', '--prefix=', '--gcc-toolchain=')) and arg != '-no-integrated-as']"),
              ('        print "error, forbidden warning:", m.group(2)',
               '        print("error, forbidden warning:", m.group(2))'),
              ('            print line,', '            sys.stdout.buffer.write(line)'),
              ("            print args[0] + ':',e.strerror", "            print(args[0] + ':', e.strerror)"),
              ("            print 'Is your PATH set correctly?'", "            print('Is your PATH set correctly?')"),
              ("            print ' '.join(args), str(e)", "            print(' '.join(args), str(e))"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"expected Python 2 line not found: {old!r}")
              s = s.replace(old, new)
          p.write_text(s)
          PYTHON
          python3 -m py_compile scripts/gcc-wrapper.py

          python3 - <<'PYTHON_PATCH'
          from pathlib import Path
          p = Path("kernel/sched/walt.h")
          s = p.read_text()
          replacements = [
              ('#define SCHED_PRINT(arg)        printk_deferred("%s=%llu", #arg, arg)',
               '#define SCHED_PRINT(arg)        printk_deferred("%s=%llu", #arg, (unsigned long long)(arg))'),
              ('printk_deferred("Time last window changed=%lu\\n",\n\t\t\tsched_ravg_window_change_time);',
               'printk_deferred("Time last window changed=%llu\\n",\n\t\t\t(unsigned long long)sched_ravg_window_change_time);'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"expected WALT format not found: {old!r}")
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("include/trace/events/sched.h")
          s = p.read_text()
          old = 'prev_energy=%llu eval_cpu=%d eval_energy=%llu best_energy_cpu=%d best_energy=%llu'
          new = 'prev_energy=%lu eval_cpu=%d eval_energy=%lu best_energy_cpu=%d best_energy=%lu'
          if old not in s:
              raise SystemExit("expected sched_compute_energy format not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("include/trace/events/walt.h")
          s = p.read_text()
          old = "active_time %u grp_cs %lld grp_ps %lld"
          new = "active_time %llu grp_cs %llu grp_ps %llu"
          if old not in s:
              raise SystemExit("expected WALT trace format not found")
          p.write_text(s.replace(old, new, 1))
          PYTHON_PATCH

          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          export ARCH=arm64 LLVM=1 PYTHON=python3 REAL_CC=clang
          export GENKSYMS_CC=aarch64-linux-gnu-gcc
          export CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          if ! make O=out KBUILD_DEFCONFIG=vendor/munch_user_defconfig defconfig > "$RUNNER_TEMP/defconfig.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/defconfig.log" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit 1
          fi
          scripts/config --file out/.config --enable KSU --disable DYNAMIC_DEBUG \
            --set-str LOCALVERSION "-perf-g045c5942d886" --disable LOCALVERSION_AUTO
          make O=out olddefconfig
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_MODVERSIONS=y' out/.config
          grep -qx 'CONFIG_LOCALVERSION="-perf-g045c5942d886"' out/.config
          ! grep -qx 'CONFIG_LOCALVERSION_AUTO=y' out/.config
          make O=out syncconfig
          export LOCALVERSION=
          rm -f out/include/config/kernel.release
          KERNEL_RELEASE="$(make --no-print-directory -s O=out kernelrelease)"
          printf '::notice::kernel release candidate: %s (stock: %s)\n' "$KERNEL_RELEASE" "$STOCK_KERNEL_RELEASE"
          if [ "$KERNEL_RELEASE" != "$STOCK_KERNEL_RELEASE" ]; then
            printf '::error::kernel release mismatch: got %s, expected %s\n' "$KERNEL_RELEASE" "$STOCK_KERNEL_RELEASE"
            exit 1
          fi
          if ! make O=out LD=aarch64-linux-android-ld -j"$(nproc)" Image.gz > "$RUNNER_TEMP/kernel-build.log" 2>&1; then
            BUILD_TAIL="$(python3 - "$RUNNER_TEMP/kernel-build.log" <<'PYLOG'
          from pathlib import Path
          import re, sys
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          matches = [i for i, line in enumerate(lines) if re.search(r"(?:fatal )?error:|clang: error:|Killed|Error [0-9]+", line)]
          if matches:
              selected = {j for i in matches[-4:] for j in range(max(0, i - 4), min(len(lines), i + 5))}
              text = "\n".join(lines[i] for i in sorted(selected))
          else:
              text = "\n".join(lines[-100:])
          print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
          )"
            printf '::error::kernel build failed: %s\n' "$BUILD_TAIL"
            exit 1
          fi

          test -s out/arch/arm64/boot/Image.gz
          mkdir -p "$GITHUB_WORKSPACE/output"
          test -s out/Module.symvers
          if grep -q '^0x00000000[[:space:]]' out/Module.symvers; then
            echo "::error::Module.symvers contains zero CRCs; refusing to package a module-incompatible kernel."
            exit 1
          fi
          cp out/Module.symvers "$GITHUB_WORKSPACE/output/Module.symvers"
          printf 'kernel_release=%s\nkernel_source_commit=%s\ndisplay_source_commit=%s\nkernelsu_tag=%s\nkernelsu_commit=%s\nclang=%s\n' \
            "$KERNEL_RELEASE" \
            "$(git rev-parse HEAD)" \
            "$DISPLAY_COMMIT" \
            "$KSU_TAG" \
            "$(git -C KernelSU rev-parse HEAD)" \
            "$(clang --version | head -n 1)" \
            > "$GITHUB_WORKSPACE/output/build-info.txt"

      - name: Package Munch AnyKernel3 ZIP
        env:
          ANYKERNEL_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
        run: |
          set -euo pipefail
          AK3="$RUNNER_TEMP/AnyKernel3"
          mkdir -p "$AK3"
          curl -fsSL "https://github.com/osm0sis/AnyKernel3/archive/$ANYKERNEL_COMMIT.tar.gz" \
            | tar -xz --strip-components=1 -C "$AK3"
          cp "$KERNEL_SRC/out/arch/arm64/boot/Image.gz" "$AK3/Image.gz"
          cp anykernel/anykernel.sh "$AK3/anykernel.sh"
          (
            cd "$AK3"
            zip -qr "$GITHUB_WORKSPACE/output/KernelSU-Munch-AnyKernel3.zip" . -x '.git/*' '.github/*'
          )

      - uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Munch-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
